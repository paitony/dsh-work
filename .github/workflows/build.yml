# Build verification CI: installs, builds and smoke-tests the desktop shell.
# Release packaging with signing runs on tag pushes (see docs/building.md).
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - name: Build
        run: pnpm run build
      - name: Desktop smoke test
        run: pnpm --filter @deepseek-ai/dsh-desktop smoke
