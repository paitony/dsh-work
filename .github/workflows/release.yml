# Build unsigned/signed platform packages from a version tag and attach them to
# the GitHub Release. The tag is the release version passed to electron-builder;
# signing is enabled automatically when the repository secrets documented in
# docs/building.md are present.
name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate and expose tag version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          VERSION="$version" node <<'NODE'
          const version = process.env.VERSION ?? ''
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
            console.error(`release tag must be vX.Y.Z or vX.Y.Z-prerelease, got v${version}`)
            process.exit(1)
          }
          NODE
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            os: macos-14
            builder_args: --mac --arm64
          - target: mac-x64
            os: macos-14
            builder_args: --mac --x64
          - target: mac-universal
            os: macos-14
            builder_args: --mac --universal
          - target: windows-x64
            os: windows-latest
            builder_args: --win --x64
          - target: linux-x64
            os: ubuntu-latest
            builder_args: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HAS_CODE_SIGNING: ${{ secrets.CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - name: Build workspace
        run: pnpm run build
      - name: Build desktop package
        run: pnpm --filter @deepseek-ai/dsh-desktop build
      - name: Desktop smoke test
        run: pnpm --filter @deepseek-ai/dsh-desktop smoke
      - name: Package desktop (unsigned)
        if: ${{ env.HAS_CODE_SIGNING != 'true' }}
        run: pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder ${{ matrix.builder_args }} --publish never --config.extraMetadata.version=${{ needs.version.outputs.version }}
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - name: Package desktop (signed)
        if: ${{ env.HAS_CODE_SIGNING == 'true' }}
        run: pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder ${{ matrix.builder_args }} --publish never --config.extraMetadata.version=${{ needs.version.outputs.version }}
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify artifact version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find apps/desktop/release -maxdepth 1 -type f -name "*-${RELEASE_VERSION}-*" -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}-${{ needs.version.outputs.version }}
          path: apps/desktop/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/**
